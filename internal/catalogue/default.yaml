# Synthetic catalogue. In production this is served by a central catalogue
# service; entries are added via PR and approved by the platform team.
version: 1
entries:
  - id: service-directory
    name: Service Directory
    description: Look up internal services, their owning team, on-call channel and runbook. Built from examples/mcp-server-template.
    owner: platform-engineering
    version: 0.1.0
    kind: local
    classification: internal
    approval: approved
    auth: hub-jwt
    tags: [platform, ownership, runbooks]
    tools:
      - name: find_service
        description: Search services by name or tag.
      - name: get_runbook
        description: Return the runbook for a service.
    docsUrl: https://github.com/Arif-Karim/mcp-hub/tree/main/examples/mcp-server-template
    artifacts:
      # From the service-directory-v0.1.0 release (checksums.txt), produced by
      # .github/workflows/publish-mcp-server.yml.
      darwin-arm64:
        url: https://github.com/Arif-Karim/mcp-hub/releases/download/service-directory-v0.1.0/service-directory_darwin_arm64.tar.gz
        sha256: "985917c5e8961d66a72e5ca431d1da8e06c5e88733396ad8a0cfdc17405bc730"
      darwin-amd64:
        url: https://github.com/Arif-Karim/mcp-hub/releases/download/service-directory-v0.1.0/service-directory_darwin_amd64.tar.gz
        sha256: "4527ad58316bb6908ddcbae752454e225e767db1f0569a7004e134be7f9ebfb7"
      linux-amd64:
        url: https://github.com/Arif-Karim/mcp-hub/releases/download/service-directory-v0.1.0/service-directory_linux_amd64.tar.gz
        sha256: "288664f54a86cf3d6872d91e2624f7ce23a4118e0271bd666e2298d03b2194d1"

  - id: deepwiki
    name: DeepWiki
    description: Ask questions about public GitHub repositories' documentation. Public, no credentials.
    owner: external (Cognition)
    version: "1"
    kind: remote
    classification: public
    approval: approved
    auth: none
    tags: [docs, github, external]
    tools:
      - name: read_wiki_structure
        description: List documentation topics for a repository.
      - name: ask_question
        description: Ask a question about a repository.
    docsUrl: https://docs.devin.ai/work-with-devin/deepwiki-mcp
    url: https://mcp.deepwiki.com/mcp

  - id: context7
    name: Context7
    description: Up-to-date library documentation and code examples. Public, no credentials.
    owner: external (Upstash)
    version: "1"
    kind: remote
    classification: public
    approval: approved
    auth: none
    tags: [docs, libraries, external]
    tools:
      - name: resolve-library-id
        description: Resolve a package name to a Context7 library ID.
      - name: get-library-docs
        description: Fetch documentation for a library.
    docsUrl: https://github.com/upstash/context7
    url: https://mcp.context7.com/mcp

  - id: jira-rovo
    name: Jira (Rovo)
    description: Search and update Jira issues. Awaiting security review of OAuth scopes.
    owner: delivery-tooling
    version: "1"
    kind: remote
    classification: confidential
    approval: pending
    auth: none
    tags: [jira, delivery]
    tools:
      - name: search_issues
        description: JQL search.
    url: https://mcp.atlassian.com/v1/mcp

  - id: payments-sandbox
    name: Payments Sandbox (legacy)
    description: Revoked after it was found returning unmasked account numbers. Kept listed so users know why it disappeared.
    owner: payments-platform
    version: 0.3.2
    kind: local
    classification: confidential
    approval: revoked
    auth: hub-jwt
    tags: [payments, legacy]
    tools:
      - name: create_test_payment
        description: Create a sandbox payment.
    artifacts: {}
