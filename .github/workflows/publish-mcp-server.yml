name: publish-mcp-server

# Builds, verifies and publishes the reference MCP server (examples/mcp-server-template).
# GitHub Releases stands in for the bank's artifact registry.
#
# Two jobs so third-party code never runs with a write token:
#   build   (contents: read)  guard, lint, test, govulncheck, package -> upload dist/
#   release (contents: write) downloads dist/ and creates the release; runs no repo code.
on:
  push:
    tags: ["service-directory-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish from main, e.g. 0.1.0 (creates tag service-directory-v<version>)"
        required: true

permissions: {}

concurrency:
  group: publish-service-directory
  cancel-in-progress: false

jobs:
  build:
    # Manual publishes only from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: examples/mcp-server-template
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: resolve version and guard
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then v="$INPUT_VERSION"; else v="${REF_NAME#service-directory-v}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $v"; exit 1; }
          grep -qF "Version = \"$v\"" internal/directory/directory.go \
            || { echo "directory.Version does not match $v; bump it before releasing"; exit 1; }
          tag="service-directory-v$v"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A pre-existing tag would make the release point at a different commit than the assets.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "tag $tag already exists; push the tag instead or bump the version"; exit 1
            fi
          else
            # Only release commits that are on main (i.e. reviewed and merged).
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            [[ "$status" == "identical" || "$status" == "behind" ]] \
              || { echo "tagged commit is not on main (compare status: $status)"; exit 1; }
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/mcp-server-template/go.mod
          cache-dependency-path: |
            examples/mcp-server-template/go.sum
            tools/go.sum

      - name: lint
        run: go tool -modfile=../../tools/go.mod golangci-lint run ./...

      - name: test
        run: go test -race ./...

      - name: govulncheck
        run: go tool -modfile=../../tools/go.mod govulncheck ./...

      - name: package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          scripts/package.sh "$VERSION" > "$RUNNER_TEMP/snippet.yaml"
          { echo "Catalogue \`artifacts:\` for this release:"; echo; echo '```yaml'; cat "$RUNNER_TEMP/snippet.yaml"; echo '```'; } > dist/release-notes.md
          cat dist/release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: examples/mcp-server-template/dist/
          if-no-files-found: error
          retention-days: 7

  # In the bank this job pushes the archives to Artifactory (signed, with the
  # sha256s as metadata) and opens a PR against the central catalogue with the
  # snippet above; platform engineering approves the PR to publish the entry.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag (dispatch) and the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "service-directory-v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "service-directory v${VERSION}" \
            --notes-file dist/release-notes.md \
            dist/*.tar.gz dist/checksums.txt
