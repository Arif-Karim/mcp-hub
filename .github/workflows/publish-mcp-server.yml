name: publish-mcp-server

# Builds, verifies and publishes the reference MCP server (examples/mcp-server-template).
# GitHub Releases stands in for the bank's artifact registry.
on:
  push:
    tags: ["service-directory-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish, e.g. 0.1.0 (creates tag service-directory-v<version>)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: examples/mcp-server-template

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/mcp-server-template/go.mod
          cache-dependency-path: |
            examples/mcp-server-template/go.sum
            tools/go.sum

      - name: resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then v="$INPUT_VERSION"; else v="${REF_NAME#service-directory-v}"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $v"; exit 1; }
          grep -q "Version = \"$v\"" internal/directory/directory.go \
            || { echo "directory.Version does not match $v; bump it before tagging"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: lint
        run: go tool -modfile=../../tools/go.mod golangci-lint run ./...

      - name: test
        run: go test -race ./...

      - name: govulncheck
        run: go tool -modfile=../../tools/go.mod govulncheck ./...

      - name: package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          scripts/package.sh "$VERSION" > "$RUNNER_TEMP/snippet.yaml"
          { echo "Catalogue \`artifacts:\` for this release:"; echo; echo "\`\`\`yaml"; cat "$RUNNER_TEMP/snippet.yaml"; echo "\`\`\`"; } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # In the bank this step pushes the archives to Artifactory (signed, with the
      # sha256s as metadata) and opens a PR against the central catalogue with the
      # snippet above; platform engineering approves the PR to publish the entry.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "service-directory-v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "service-directory v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.tar.gz dist/checksums.txt
