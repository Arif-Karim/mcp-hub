name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # e.g. run the macOS installer job on a branch: gh workflow run ci.yml --ref <branch>

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks + mutation diff need history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: verify
        run: scripts/verify.sh

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: mutation test changed packages
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: scripts/mutation.sh

  # End-to-end install on a real Mac: package -> install.sh -> health -> uninstall.
  # Push to main only, to keep macOS minutes low.
  installer:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: package
        env:
          VERSION: v0.0.0-ci
        run: scripts/package-release.sh darwin/arm64
      - name: install, check, uninstall
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          ./install.sh --local-artifact dist --no-launchd --no-open --skip-claude
          test -x "$HOME/.local/bin/mcp-hub"
          tar -tzf dist/mcp-hub_darwin_arm64.tar.gz > "$RUNNER_TEMP/tarlist"
          if grep -q '^skill/' "$RUNNER_TEMP/tarlist"; then echo 'skill should ship inside the binary only'; exit 1; fi
          for s in mcp-hub mcp-hub-build-server mcp-hub-publish-server; do
            test -f "$HOME/.claude/skills/$s/SKILL.md"
            head -n 2 "$HOME/.claude/skills/$s/SKILL.md" | grep -qx "name: $s"
          done
          curl -fsS http://127.0.0.1:7420/api/v1/health | grep -q '"status":"ok"'
          "$HOME/.local/bin/mcp-hub" search --json | grep -q '"items"'
          ./install.sh --uninstall
          test ! -e "$HOME/.local/bin/mcp-hub"
          for s in mcp-hub mcp-hub-build-server mcp-hub-publish-server; do test ! -e "$HOME/.claude/skills/$s"; done
          if curl -fsS --max-time 2 http://127.0.0.1:7420/api/v1/health; then echo 'daemon still running after uninstall'; exit 1; fi
