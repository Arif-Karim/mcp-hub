version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - revive
    - bodyclose
    - errorlint
    - noctx
    - misspell
    - unconvert
    - unparam
  exclusions:
    presets: [comments, common-false-positives, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, unparam]
formatters:
  enable: [gofmt, goimports]
